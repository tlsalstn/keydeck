server:
  port: 8787
  token: "CHANGE-ME-generate-with: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'"

pages:
  default:
    # launch: 실행 중이면 창 포커스, 아니면 새로 실행.
    #   class(선택): KWin 창 클래스 부분일치 (기본값 app), process(선택): pgrep -f 패턴 (기본값 app)
    F1: { label: "터미널", icon: "🖥️", action: { type: launch, app: org.kde.konsole, class: org.kde.konsole, process: "^/usr/bin/konsole" } }
    F2: { label: "알림 테스트", icon: "🔔", action: { type: shell, cmd: "notify-send MacPad 눌림" } }
    F3: { label: "붙여넣기", icon: "📋", action: { type: hotkey, keys: [ctrl, shift, v] } }
    F4: { label: "인사말", icon: "✉️", action: { type: text, text: "안녕하세요." } }
    F5: { label: "재생/정지", icon: "⏯️", action: { type: media, op: play-pause } }
    F6: { label: "볼륨 +", icon: "🔊", action: { type: media, op: volume-up }, repeat: true }
    F7: { label: "오버뷰", icon: "🗂️", action: { type: kde, component: kwin, shortcut: Overview } }
    F8: { label: "문서", icon: "🌐", action: { type: url, url: "https://kde.org" } }
    # url + browser/class(선택): 특정 브라우저로 열고 그 창을 포커스
    F9: { label: "GitLab", icon: "🦝", action: { type: url, url: "https://gitlab.example.com/group/project", browser: firefox, class: firefox } }
    # page 액션: 특정 키로 페이지 이동 (내장 내비게이션: Tab=다음, Shift+Tab=이전, F1~F12=직접 선택 — 매핑된 키가 우선)
    E: { label: "미디어 페이지", icon: "🎵", action: { type: page, to: media } }
  media:
    F5: { label: "재생/정지", icon: "⏯️", action: { type: media, op: play-pause } }
    E: { label: "메인으로", icon: "🏠", action: { type: page, to: default } }
